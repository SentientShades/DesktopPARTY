<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/toast.css">
</head>
<body>
  <canvas id="draw-canvas"></canvas>

  <div id="cursor-layer">
    <div id="cursor-local" class="cursor">
      <svg viewBox="0 0 16 16"><path d="M1 1l5 13 2-5 5-2z"/></svg>
      <span class="cursor-label">me</span>
    </div>
  </div>

  <div id="partytoast" class="toast party-toast interactive hidden" data-status="online">
    <div class="avatar-wrap" id="partyavatar">
      <img class="avatar" id="partyimage" src="" alt="">
    </div>

    <div class="toast-body">
      <span class="toast-name">In a party</span>
      <span class="toast-sub" id="partynames">-</span>
    </div>

    <div class="pp-stack" id="partystack"></div>
    <span class="pp-count" id="partycount">0/8</span>
  </div>

  <div id="drawtoast" class="draw-toast interactive hidden">
    <div class="draw-head" id="drawgrip">
      <span class="draw-title">Draw</span>
      <button class="draw-x" id="drawclose" aria-label="Close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M3 3l10 10M13 3L3 13"/>
        </svg>
      </button>
    </div>

    <div class="draw-body">
      <div class="pd-tool-row">
        <button class="tool custom-swatch" id="drawswatch" aria-label="Pen"></button>
        <input type="range" id="drawhue" class="hue-slider" min="0" max="360" value="140" step="1" aria-label="Colour">
        <button class="tool eraser" id="draweraser" aria-label="Eraser">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M4 12h9M6.5 12L3 8.5l5-5 3.5 3.5-5.5 5z"/>
          </svg>
        </button>
        <button class="tool clear" id="drawclear" aria-label="Clear">Clear</button>
      </div>

      <div class="pd-picker">
        <span class="pd-label">Light</span>
        <input type="range" id="drawlight" class="light-slider" min="0" max="100" value="50" step="1" aria-label="Brightness">
      </div>

      <div class="pd-picker">
        <span class="pd-label">Size</span>
        <input type="range" id="drawsize" class="size-slider" min="2" max="24" value="4" step="1" aria-label="Brush size">
        <span class="pd-size-val" id="drawsizeval">4</span>
      </div>

      <p class="pd-hint" id="drawhint">Pick the pen to draw anywhere on screen</p>
    </div>
  </div>

  <div id="toast-stack"></div>

  <script src="../js/debug.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../vendor/matter.min.js"></script>
  <script src="../js/world.js"></script>
  <script src="../js/activities.js"></script>
  <script src="../js/tabletop.js"></script>
  <script src="../js/pool.js"></script>
</body>
</html>
